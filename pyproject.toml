[project]
name = "mait-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["mait-core", "mait-models"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mait-core = { workspace = true }
mait-models = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]
