# Local development stack. PostgreSQL is the only required service (RFC-001 §12.2, A11).
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#   docker compose -f infrastructure/docker/docker-compose.yml --profile storage up -d   # + MinIO
#   docker compose -f infrastructure/docker/docker-compose.yml --profile models up -d    # + Ollama
#   docker compose -f infrastructure/docker/docker-compose.yml exec ollama ollama pull qwen3:4b
# The server and worker services are added in Phase 1.
name: mait

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mait
      POSTGRES_PASSWORD: mait-dev-only
      POSTGRES_DB: mait
    ports:
      - "5432:5432"
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mait -d mait"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mait
      MINIO_ROOT_PASSWORD: mait-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Local open-weight model server (ADR-019). Serves the OpenAI-compatible API at
  # http://localhost:11434/v1. CPU works for small models; add a GPU reservation for speed.
  ollama:
    profiles: ["models"]
    image: ollama/ollama:0.40.5
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  miniodata:
  ollamadata:
